[project]
name = "docugraph-rag"
version = "0.2.0"
description = "DocuGraph RAG — Nền tảng trích xuất & hỏi đáp tài liệu thông minh với GraphRAG + PP-OCRv6"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # Framework & API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",

    # AI / RAG Pipeline
    "langchain>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "google-genai",

    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "neo4j>=5.12.0",

    # Document Processing — PP-OCRv6 (2026)
    # PP-OCRv6: +4.6% detection, +5.1% recognition vs PP-OCRv5
    # 5.2x CPU speedup, 50 languages unified model
    # Source: https://github.com/PaddlePaddle/PaddleOCR
    "pymupdf>=1.24",
    "paddleocr>=2.9",       # PP-OCRv6 requires >= 2.9
    "paddlepaddle>=2.6",
    "pillow>=10.0",

    # Web Scraping
    "httpx>=0.27",
    "beautifulsoup4>=4.12",

    # Auth & Security
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",
    "email-validator>=2.0.0",

    # Utilities
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "aiofiles>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]
eval = [
    "ragas>=0.1",
    "openpyxl>=3.1",
    "pandas>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
