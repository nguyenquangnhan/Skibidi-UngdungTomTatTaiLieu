name: Skibidi CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio fastapi "uvicorn[standard]" python-multipart httpx "sqlalchemy[asyncio]" asyncpg pgvector neo4j google-genai langchain-google-genai langchain-text-splitters passlib bcrypt pyjwt "pydantic[email]" email-validator pydantic-settings python-dotenv aiofiles beautifulsoup4 pillow pypdf pymupdf python-docx
      - name: Run pytest
        env:
          PYTHONPATH: .
          SECRET_KEY: ci-test-secret-key
          GEMINI_API_KEY: ci-dummy-gemini-key
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/skibidi
        run: python -m pytest -v

  frontend-build-and-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build Next.js
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E tests
        run: npx playwright test

  flutter-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test test/widget_test.dart test/core test/shared
